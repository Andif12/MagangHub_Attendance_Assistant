<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAA Companion</title>
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #090d16;
      color: #f1f5f9;
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 8px;
    }
    .title {
      font-weight: 700;
      font-size: 14px;
      color: #38bdf8;
    }
    .status-box {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 12px;
    }
    .input-field {
      width: 100%;
      box-sizing: border-box;
      padding: 6px 10px;
      margin-bottom: 10px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #f1f5f9;
      font-size: 11px;
    }
    .input-field:focus {
      outline: none;
      border-color: #38bdf8;
    }
    .btn {
      width: 100%;
      padding: 8px 12px;
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
    }
    .btn:hover { background: #0284c7; }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 600;
      margin-top: 4px;
    }
    .badge-approved { background: rgba(16, 185, 129, 0.2); color: #34d399; }
    .badge-action { background: rgba(249, 115, 22, 0.2); color: #fb923c; }
    .footer {
      margin-top: 12px;
      font-size: 11px;
      text-align: center;
      color: #64748b;
    }
    .footer a { color: #38bdf8; text-decoration: none; }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">MAA Companion Assistant</div>
  </div>

  <div class="status-box">
    <div style="color: #94a3b8; font-size: 11px;">Status Sesi Browser:</div>
    <div id="sessionStatus" style="font-weight: 600; margin-top: 2px;">Memeriksa cookie sesi...</div>
    <div id="attendanceResult" style="margin-top: 8px; display: none;"></div>
  </div>

  <input 
    type="text" 
    id="participantIdInput" 
    class="input-field" 
    placeholder="Participant ID (opsional jika otomatis)"
  />

  <button class="btn" id="checkBtn" style="margin-bottom: 8px;">Periksa Presensi Monev Nyata</button>
  <button class="btn" id="syncMaaBtn" style="background: linear-gradient(135deg, #059669, #10b981);">Sinkronkan ke Web MAA (Localhost)</button>
  <div id="syncResult" style="margin-top: 8px; font-size: 11px; display: none;"></div>

  <div class="footer">
    <a href="http://localhost:3000" target="_blank">Buka Dashboard Lengkap MAA</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
