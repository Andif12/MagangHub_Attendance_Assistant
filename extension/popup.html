<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAA Companion (DOM-Only)</title>
  <style>
    body {
      width: 340px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #090d16;
      color: #f1f5f9;
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 8px;
    }
    .title {
      font-weight: 700;
      font-size: 13px;
      color: #38bdf8;
    }
    .badge-mode {
      background: rgba(14, 165, 233, 0.15);
      border: 1px solid rgba(14, 165, 233, 0.3);
      color: #38bdf8;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
    }
    .status-box {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .status-label {
      color: #94a3b8;
      font-size: 11px;
      margin-bottom: 4px;
    }
    .status-val {
      font-weight: 600;
      font-size: 12px;
    }
    .records-list {
      max-height: 140px;
      overflow-y: auto;
      margin-top: 8px;
      padding: 6px;
      background: #090d16;
      border-radius: 6px;
      border: 1px solid #1e293b;
      font-size: 11px;
    }
    .record-item {
      display: flex;
      justify-content: space-between;
      padding: 3px 0;
      border-bottom: 1px solid #1e293b;
    }
    .record-item:last-child {
      border-bottom: none;
    }
    .btn {
      width: 100%;
      padding: 8px 12px;
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      margin-bottom: 8px;
    }
    .btn:hover { background: #0284c7; }
    .btn-secondary {
      background: #1e293b;
      border: 1px solid #334155;
      color: #e2e8f0;
    }
    .btn-secondary:hover { background: #334155; }
    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .info-note {
      font-size: 11px;
      color: #94a3b8;
      line-height: 1.4;
      background: rgba(30, 41, 59, 0.5);
      border-radius: 6px;
      padding: 8px;
      margin-bottom: 12px;
    }
    .footer {
      font-size: 11px;
      text-align: center;
      color: #64748b;
      margin-top: 8px;
    }
    .footer a { color: #38bdf8; text-decoration: none; }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">MAA Companion Assistant</div>
    <div class="badge-mode">DOM-ONLY</div>
  </div>

  <div class="info-note">
    <b>Keamanan Nol-Token:</b> Ekstensi membaca presensi langsung dari tampilan layar aktif Monev tanpa mengambil kata sandi, token, atau cookie.
  </div>

  <div class="status-box">
    <div class="status-label">Status Tab Portal Monev:</div>
    <div id="tabStatus" class="status-val" style="color: #fb923c;">Memeriksa tab...</div>

    <div class="status-label" style="margin-top: 8px;">Hasil Pembacaan DOM:</div>
    <div id="readStatusText" style="color: #94a3b8; font-size: 11px;">Belum diperiksa</div>

    <div id="recordsContainer" style="display: none;">
      <div id="recordsCount" style="font-weight: 600; margin-top: 6px; color: #34d399; font-size: 11px;"></div>
      <div id="recordsList" class="records-list"></div>
    </div>
  </div>

  <button class="btn" id="readDomBtn">Baca DOM Presensi di Tab Aktif</button>
  <button class="btn btn-secondary" id="openMonevBtn">Buka Riwayat Presensi Monev</button>
  <button class="btn btn-secondary" id="forwardToMaaBtn" style="display: none;">Teruskan ke Web MAA</button>

  <div id="actionMsg" style="font-size: 11px; margin-top: 4px; display: none;"></div>

  <div class="footer">
    <a href="http://localhost:3000" target="_blank">Buka Website MAA (Localhost)</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
